name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # let-go ref is single-sourced from .let-go-version (shared with release.yml).
      - name: Resolve let-go ref
        id: letgo
        run: echo "ref=$(grep -v '^#' .let-go-version | grep . | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Cloned as a sibling of the workspace so build.sh's default LETGO_DIR
      # (../let-go) and build/go.mod's `replace => ../../let-go` both resolve.
      - name: Clone let-go
        run: |
          git clone https://github.com/nooga/let-go.git "$GITHUB_WORKSPACE/../let-go"
          git -C "$GITHUB_WORKSPACE/../let-go" checkout "${{ steps.letgo.outputs.ref }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: build/go.mod
          cache-dependency-path: build/go.sum

      - name: Build lg from the pinned let-go
        run: |
          go build -C "$GITHUB_WORKSPACE/../let-go" -o "$GITHUB_WORKSPACE/../lg" .

      - name: Run test suite
        run: |
          "$GITHUB_WORKSPACE/../lg" test/run.lg

      # Full AOT native build (build lg, lower legmacs.*, bundle, go build) -- the
      # same path release.yml ships. Guards against a build break landing on main.
      - name: Native build smoke
        run: ./build.sh

      # The release targets the host build above can't speak for: Plan 9 has no
      # termios (let-go's runtime drives /dev/consctl there instead), and
      # plan9/arm is the only 32-bit target we ship, where an int-size mistake
      # would show up. Cross-compiling both on every PR keeps them from
      # breaking silently until release day. The AOT tree build.sh just
      # generated is host-independent, so this is only a `go build`.
      - name: Cross-compile smoke (plan 9)
        run: |
          set -euo pipefail
          for target in plan9/amd64 plan9/arm; do
            os="${target%/*}"; arch="${target#*/}"
            echo "==> $os/$arch"
            (cd build && GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
               go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/legmacs_${os}_${arch}" .)
          done
